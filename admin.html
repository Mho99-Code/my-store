<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - المتجر</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2c3e50; --accent: #e67e22; --danger: #e74c3c;
      --success: #27ae60; --bg: #f0f2f5; --card: #fff;
      --border: #dde1e7; --muted: #7f8c8d; --radius: 10px;
      --shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg); color: var(--primary); min-height: 100vh; }

    /* ===== Login Screen ===== */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: linear-gradient(135deg, #2c3e50, #3d5a73);
    }
    .login-box {
      background: #fff; border-radius: 16px; padding: 40px 36px;
      width: min(380px, 92vw); box-shadow: 0 8px 32px rgba(0,0,0,.25); text-align: center;
    }
    .login-box h2 { font-size: 1.4rem; margin-bottom: 6px; }
    .login-box p  { color: var(--muted); font-size: .88rem; margin-bottom: 24px; }
    .login-box input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 1rem; outline: none; margin-bottom: 14px;
      transition: border .2s; text-align: center; letter-spacing: 4px;
    }
    .login-box input:focus { border-color: var(--accent); }
    .login-box button {
      width: 100%; padding: 13px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background .2s;
    }
    .login-box button:hover { background: #d35400; }
    .login-err { color: var(--danger); font-size: .85rem; margin-top: 10px; min-height: 18px; }

    /* ===== App Shell ===== */
    #appShell { display: none; }
    header {
      background: var(--primary); color: #fff; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; position: sticky; top: 0; z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    header h1 { font-size: 1.1rem; }
    .header-actions { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px; border-radius: 7px; border: none; cursor: pointer;
      font-size: .85rem; font-weight: 600; transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-accent  { background: var(--accent);  color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-outline { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.5); }
    .btn-sm { padding: 5px 11px; font-size: .8rem; }

    /* ===== Stats ===== */
    .stats {
      max-width: 1100px; margin: 24px auto 0; padding: 0 16px;
      display: flex; gap: 14px; flex-wrap: wrap;
    }
    .stat-card {
      background: var(--card); border-radius: var(--radius); padding: 16px 20px;
      box-shadow: var(--shadow); flex: 1; min-width: 130px; text-align: center;
    }
    .stat-num  { font-size: 1.8rem; font-weight: 800; color: var(--accent); }
    .stat-label{ font-size: .8rem; color: var(--muted); margin-top: 2px; }

    /* ===== Toolbar ===== */
    .toolbar {
      max-width: 1100px; margin: 18px auto 0; padding: 0 16px;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .toolbar input, .toolbar select {
      padding: 9px 13px; border: 1.5px solid var(--border); border-radius: 7px;
      font-size: .9rem; outline: none; background: #fff; transition: border .2s;
    }
    .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
    .toolbar input[type=text] { flex: 1; min-width: 180px; }

    /* ===== Table ===== */
    .table-wrap {
      max-width: 1100px; margin: 16px auto 40px; padding: 0 16px;
      overflow-x: auto;
    }
    table {
      width: 100%; background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); border-collapse: collapse; overflow: hidden;
    }
    th {
      background: var(--primary); color: #fff; padding: 12px 14px;
      font-size: .82rem; font-weight: 600; white-space: nowrap; text-align: right;
    }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: .88rem; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }
    td input, td select {
      padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 6px;
      font-size: .85rem; width: 100%; outline: none; transition: border .2s;
    }
    td input:focus, td select:focus { border-color: var(--accent); }
    .price-input { text-align: center; font-weight: 700; color: var(--accent); }
    .actions-cell { display: flex; gap: 6px; justify-content: center; }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 200;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 14px; padding: 28px 28px 24px;
      width: min(480px, 94vw); box-shadow: 0 8px 32px rgba(0,0,0,.2);
      max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { font-size: 1.1rem; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .83rem; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
      border-radius: 7px; font-size: .92rem; outline: none; transition: border .2s; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 70px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

    /* ===== Toast & Loader ===== */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--primary); color: #fff; padding: 11px 24px;
      border-radius: 30px; font-size: .88rem; box-shadow: 0 4px 16px rgba(0,0,0,.2);
      transition: transform .3s; z-index: 400; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error   { background: var(--danger); }

    .loading-row td { text-align: center; padding: 40px; color: var(--muted); }
    .spinner {
      display: inline-block; width: 28px; height: 28px;
      border: 3px solid #ddd; border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .stats .stat-card { min-width: 100px; }
      th, td { padding: 8px 10px; font-size: .8rem; }
    }
  </style>
</head>
<body>
<!-- ==================== Login ==================== -->
<div id="loginScreen">
  <div class="login-box">
    <div style="font-size:2.2rem;margin-bottom:10px">🔐</div>
    <h2>لوحة التحكم</h2>
    <p>أدخل كلمة المرور للدخول</p>
    <input type="password" id="pwdInput" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')doLogin()" />
    <button onclick="doLogin()">دخول</button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<!-- ==================== App Shell ==================== -->
<div id="appShell">
  <header>
    <h1>⚙️ لوحة التحكم - المتجر</h1>
    <div class="header-actions">
      <button class="btn btn-success" onclick="openAddModal()">+ إضافة منتج</button>
      <button class="btn btn-accent"  onclick="saveAllChanges()">💾 حفظ التعديلات</button>
      <button class="btn btn-outline" onclick="loadProducts()">🔄 تحديث</button>
      <button class="btn btn-outline" onclick="logout()">خروج</button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats" id="statsRow"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 بحث عن منتج..." oninput="renderTable()" />
    <select id="catFilter" onchange="renderTable()">
      <option value="">كل الأقسام</option>
    </select>
    <select id="stockFilter" onchange="renderTable()">
      <option value="">الكل</option>
      <option value="true">متاح</option>
      <option value="false">غير متاح</option>
    </select>
    <label style="cursor:pointer">
      <input type="file" id="xlsxInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="importFile(event)" />
      <span class="btn btn-outline" style="color:var(--primary);border-color:var(--border);background:#fff" onclick="document.getElementById('xlsxInput').click()">📥 استيراد Excel/CSV</span>
    </label>
    <button class="btn btn-outline" style="color:var(--primary);border-color:var(--border);background:#fff" onclick="exportCSV()">📤 تصدير CSV</button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table id="productsTable">
      <thead>
        <tr>
          <th>#</th>
          <th>اسم المنتج</th>
          <th>القسم</th>
          <th>السعر (جنيه)</th>
          <th>الوحدة</th>
          <th>الوصف</th>
          <th>متاح؟</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="loading-row"><td colspan="8"><div class="spinner"></div><p>جاري التحميل...</p></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ==================== Add/Edit Modal ==================== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">إضافة منتج جديد</h3>
    <input type="hidden" id="mId" />
    <div class="field"><label>اسم المنتج *</label><input type="text" id="mName" placeholder="مثال: تفاح أحمر" /></div>
    <div class="field"><label>القسم</label><input type="text" id="mCategory" placeholder="مثال: فواكه" /></div>
    <div class="field"><label>السعر (جنيه) *</label><input type="number" id="mPrice" min="0" step="0.5" placeholder="0" /></div>
    <div class="field"><label>الوحدة</label><input type="text" id="mUnit" placeholder="مثال: كيلو" /></div>
    <div class="field"><label>الوصف</label><textarea id="mDesc" placeholder="وصف مختصر..."></textarea></div>
    <div class="field">
      <label>متاح للبيع؟</label>
      <select id="mStock"><option value="true">✓ متاح</option><option value="false">✗ غير متاح</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" style="color:var(--muted);border-color:var(--border)" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-success" onclick="saveModal()">حفظ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbzNsI6c3Q1mJirRP0FKmQyi5rg1IxySYdC1PweO7hGrS13CypuKIz5FLURm9Q8f352LVA/exec";
var SESSION_KEY = "admin_auth";
var password    = "";
var allProducts = [];
var pendingChanges = {};

// 👑 دالة الاتصال بالسيرفر المصححة لحل الـ CORS والـ Preflight
function callAPI(payload) {
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); });
}

// ===== Login =====
function doLogin() {
  var val = document.getElementById("pwdInput").value.trim();
  if (!val) { showErr("أدخل كلمة المرور"); return; }
  password = val;
  sessionStorage.setItem(SESSION_KEY, "1");
  showApp(); // يفتح الواجهة فوراً
}
  callAPI({ action: "update", password: val, product: { id: "__test__" } })
    .then(function(r){
      if (r.status === "ok" || r.message === "المنتج برقم __test__ غير موجود") {
        sessionStorage.setItem(SESSION_KEY, "1");
        showApp();
      } else if (r.message === "كلمة المرور غير صحيحة") {
        showErr("كلمة المرور غير صحيحة ❌");
        password = "";
      } else {
        showErr("تأكد من رابط الـ API في الكود");
        password = "";
      }
    })
    .catch(function(){ showErr("تعذّر الاتصال بالسيرفر. تأكد من الرابط."); password = ""; });
}

function showErr(m) { document.getElementById("loginErr").textContent = m; }

function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display = "block";
  loadProducts();
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  password = "";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("appShell").style.display = "none";
  document.getElementById("pwdInput").value = "";
  document.getElementById("loginErr").textContent = "";
}

// ===== Load =====
function loadProducts() {
  document.getElementById("tableBody").innerHTML =
    '<tr class="loading-row"><td colspan="8"><div class="spinner"></div></td></tr>';
  fetch(API_URL)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.status !== "ok") throw new Error(data.message);
      allProducts = data.products || [];
      pendingChanges = {};
      buildCategoryFilter();
      renderStats();
      renderTable();
    })
    .catch(function(e){ showToast("خطأ في التحميل: " + e.message, "error"); });
}

// ===== Stats =====
function renderStats() {
  var total    = allProducts.length;
  var inStock  = allProducts.filter(function(p){ return isTrue(p.inStock); }).length;
  var outStock = total - inStock;
  var cats     = new Set(allProducts.map(function(p){ return p.category || "عام"; })).size;
  document.getElementById("statsRow").innerHTML =
    stat(total, "إجمالي المنتجات") +
    stat(inStock, "متاح") +
    stat(outStock, "غير متاح") +
    stat(cats, "قسم");
}

function stat(n, l) {
  return '<div class="stat-card"><div class="stat-num">' + n + '</div><div class="stat-label">' + l + '</div></div>';
}

// ===== Category Filter =====
function buildCategoryFilter() {
  var cats = [...new Set(allProducts.map(function(p){ return p.category || "عام"; }))];
  var sel = document.getElementById("catFilter");
  sel.innerHTML = '<option value="">كل الأقسام</option>';
  cats.forEach(function(c){
    var o = document.createElement("option");
    o.value = c; o.textContent = c; sel.appendChild(o);
  });
}

// ===== Render Table =====
function renderTable() {
  var search = document.getElementById("searchInput").value.trim().toLowerCase();
  var cat    = document.getElementById("catFilter").value;
  var stock  = document.getElementById("stockFilter").value;

  var filtered = allProducts.filter(function(p){
    var ms = !search || (p.name||"").toLowerCase().includes(search) || (p.category||"").toLowerCase().includes(search);
    var mc = !cat || (p.category||"عام") === cat;
    var mk = stock === "" ? true : stock === "true" ? isTrue(p.inStock) : !isTrue(p.inStock);
    return ms && mc && mk;
  });

  if (!filtered.length) {
    document.getElementById("tableBody").innerHTML =
      '<tr class="loading-row"><td colspan="8" style="color:var(--muted)">لا توجد نتائج</td></tr>';
    return;
  }

  document.getElementById("tableBody").innerHTML = filtered.map(function(p, i){
    var ch = pendingChanges[p.id] || p;
    var inStock = isTrue(ch.inStock);
    return '<tr id="row_' + escId(p.id) + '">' +
      '<td style="color:var(--muted);font-size:.78rem">' + (i+1) + '</td>' +
      '<td><input type="text" value="' + escAttr(ch.name||"") + '" oninput="markChange(\'' + escAttr(p.id) + '\',\'name\',this.value)" /></td>' +
      '<td><input type="text" value="' + escAttr(ch.category||"") + '" oninput="markChange(\'' + escAttr(p.id) + '\',\'category\',this.value)" /></td>' +
      '<td><input type="number" class="price-input" value="' + (ch.price||0) + '" min="0" step="0.5" oninput="markChange(\'' + escAttr(p.id) + '\',\'price\',this.value)" /></td>' +
      '<td><input type="text" value="' + escAttr(ch.unit||"") + '" oninput="markChange(\'' + escAttr(p.id) + '\',\'unit\',this.value)" style="max-width:80px" /></td>' +
      '<td><input type="text" value="' + escAttr(ch.description||"") + '" oninput="markChange(\'' + escAttr(p.id) + '\',\'description\',this.value)" /></td>' +
      '<td>' +
        '<select onchange="markChange(\'' + escAttr(p.id) + '\',\'inStock\',this.value)">' +
          '<option value="true"'  + (inStock ? " selected" : "") + '>✓ متاح</option>' +
          '<option value="false"' + (!inStock ? " selected" : "") + '>✗ غير متاح</option>' +
        '</select>' +
      '</td>' +
      '<td class="actions-cell">' +
        '<button class="btn btn-danger btn-sm" onclick="deleteProduct(\'' + escAttr(p.id) + '\')">🗑</button>' +
      '</td>' +
    '</tr>';
  }).join("");
}

// ===== Track Changes =====
function markChange(id, field, value) {
  if (!pendingChanges[id]) {
    var orig = allProducts.find(function(p){ return String(p.id) === String(id); });
    pendingChanges[id] = Object.assign({}, orig);
  }
  pendingChanges[id][field] = value;
}

// ===== Save All =====
function saveAllChanges() {
  var changed = Object.values(pendingChanges);
  if (!changed.length) { showToast("لا توجد تعديلات معلقة", ""); return; }
  callAPI({ action: "bulkUpdate", password: password, products: changed })
    .then(function(r){
      if (r.status === "ok") {
        showToast("✓ تم حفظ " + changed.length + " تعديل بنجاح", "success");
        loadProducts();
      } else {
        showToast("خطأ: " + r.message, "error");
      }
    })
    .catch(function(e){ showToast("خطأ في الاتصال", "error"); });
}

// ===== Delete =====
function deleteProduct(id) {
  if (!confirm("هل أنت متأكد من حذف هذا المنتج؟")) return;
  callAPI({ action: "delete", password: password, id: id })
    .then(function(r){
      if (r.status === "ok") { showToast("تم الحذف", "success"); loadProducts(); }
      else showToast("خطأ: " + r.message, "error");
    });
}

// ===== Add Modal =====
function openAddModal() {
  document.getElementById("modalTitle").textContent = "إضافة منتج جديد";
  ["mId","mName","mCategory","mPrice","mUnit","mDesc"].forEach(function(id){
    document.getElementById(id).value = "";
  });
  document.getElementById("mStock").value = "true";
  document.getElementById("modalOverlay").classList.add("open");
}

function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); }

function saveModal() {
  var name  = document.getElementById("mName").value.trim();
  var price = document.getElementById("mPrice").value.trim();
  if (!name) { alert("اسم المنتج مطلوب"); return; }
  if (!price) { alert("السعر مطلوب"); return; }

  var product = {
    name:        name,
    category:    document.getElementById("mCategory").value.trim() || "عام",
    price:       parseFloat(price) || 0,
    unit:        document.getElementById("mUnit").value.trim()     || "قطعة",
    description: document.getElementById("mDesc").value.trim(),
    inStock:     document.getElementById("mStock").value === "true"
  };

  callAPI({ action: "add", password: password, product: product })
    .then(function(r){
      if (r.status === "ok") {
        showToast("✓ تمت الإضافة", "success");
        closeModal();
        loadProducts();
      } else showToast("خطأ: " + r.message, "error");
    });
}

// ===== Import CSV / Excel =====
function importFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var text = ev.target.result;
    var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
    if (lines.length < 2) { showToast("الملف فارغ أو غير صحيح", "error"); return; }
    var headers = lines[0].split(",").map(function(h){ return h.trim().replace(/^"|"$/g,""); });
    var products = lines.slice(1).map(function(line){
      var vals = line.split(",").map(function(v){ return v.trim().replace(/^"|"$/g,""); });
      var obj = {};
      headers.forEach(function(h,i){ obj[h] = vals[i] || ""; });
      return obj;
    }).filter(function(p){ return p.name || p["اسم المنتج"]; });

    products = products.map(function(p){
      return {
        id:          p.id || p["id"] || Date.now().toString() + Math.random(),
        name:        p.name || p["اسم المنتج"] || "",
        category:    p.category || p["القسم"] || "عام",
        price:       parseFloat(p.price || p["السعر"] || 0),
        unit:        p.unit || p["الوحدة"] || "قطعة",
        description: p.description || p["الوصف"] || "",
        inStock:     (p.inStock||p["متاح"]||"true").toLowerCase() !== "false"
      };
    });

    if (!confirm("سيتم رفع " + products.length + " منتج. هل تريد المتابعة؟")) return;
    callAPI({ action: "bulkUpdate", password: password, products: products })
      .then(function(r){
        if (r.status === "ok") { showToast("✓ تم الاستيراد بنجاح", "success"); loadProducts(); }
        else showToast("خطأ: " + r.message, "error");
      });
  };
  reader.readAsText(file, "UTF-8");
  e.target.value = "";
}

// ===== Export CSV =====
function exportCSV() {
  if (!allProducts.length) { showToast("لا توجد منتجات للتصدير", ""); return; }
  var headers = ["id","name","category","price","unit","description","inStock"];
  var rows = [headers.join(",")].concat(allProducts.map(function(p){
    return headers.map(function(h){ return '"' + String(p[h]||"").replace(/"/g,'""') + '"'; }).join(",");
  }));
  var blob = new Blob(["\uFEFF" + rows.join("\n")], { type: "text/csv;charset=utf-8;" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "products_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
}

// ===== Helpers =====
function isTrue(v) { return v === true || v === "true" || v === "TRUE"; }
function escAttr(s) { return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function escId(s)   { return String(s).replace(/[^a-zA-Z0-9_-]/g,"_"); }

function showToast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (type ? " " + type : "");
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2800);
}
</script>
