<script>
const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const loadingState = document.getElementById('loadingState');
const visibleCount = document.getElementById('visibleCount');
let allProducts = [];
let firstLoad = true;
let cart = {};
let activeFilter = '';

function fmt(n){ 
  const num = Number(n);
  return isNaN(num) ? '0' : new Intl.NumberFormat('en-US').format(num); 
}

// دالة لتوحيد مسميات الأعمدة القادمة من Google Sheet مهما كان مسمى العمود
function normalizeProduct(item, index) {
  // إذا كانت البيانات القادمة عبارة عن مصفوفة صفوف (2D Array)
  if (Array.isArray(item)) {
    return {
      id: item[0] || index,
      name: String(item[1] || 'منتج بدون اسم'),
      price: Number(item[2]) || 0,
      qty: Number(item[3]) || 0,
      img: item[4] || '',
      category: item[5] || ''
    };
  }

  // إذا كانت البيانات القادمة Object
  const getProp = (...keys) => {
    for (let k of keys) {
      for (let p in item) {
        if (p.trim().toLowerCase() === k.trim().toLowerCase()) return item[p];
      }
    }
    return null;
  };

  return {
    id: getProp('id', 'ID', 'م') || index,
    name: String(getProp('name', 'Name', 'title', 'الاسم', 'اسم المنتج', 'منتج') || 'منتج بدون اسم'),
    price: Number(getProp('price', 'Price', 'السعر', 'سعر') || 0),
    qty: Number(getProp('qty', 'quantity', 'stock', 'الكمية', 'المخزون', 'المتاح') || 0),
    img: getProp('img', 'image', 'photo', 'url', 'الصورة', 'رابط الصورة') || '',
    category: String(getProp('category', 'cat', 'type', 'الفئة', 'القسم') || '')
  };
}

function matchesFilter(p, filterStr, searchStr){
  const name = p.name.toLowerCase();
  const cat = p.category.toLowerCase();
  const targetText = name + ' ' + cat;
  
  const search = (searchStr || '').toLowerCase();
  const searchOk = !search || targetText.includes(search);

  if (!filterStr || filterStr.trim() === '') {
    return searchOk;
  }

  const filterKeywords = filterStr.toLowerCase().split(' ');
  const filterOk = filterKeywords.some(kw => targetText.includes(kw));

  return filterOk && searchOk;
}

function applyFilters(){
  const searchStr = document.getElementById('searchInput').value.trim();
  const list = allProducts.filter(p => matchesFilter(p, activeFilter, searchStr));
  render(list);
}

function render(list){
  grid.innerHTML = '';
  
  if(!list || list.length === 0){ 
    emptyState.classList.add('show'); 
  } else { 
    emptyState.classList.remove('show'); 
  }
  
  visibleCount.textContent = list ? list.length : 0;

  list.forEach(p => {
    const isOut = p.qty <= 0;
    const isLow = !isOut && p.qty <= 5;
    const card = document.createElement('div');
    card.className = 'card';
    
    const imgSrc = p.img && p.img.trim() !== '' ? p.img : 'https://via.placeholder.com/200?text=ISLEY';

    card.innerHTML = `
      <div class="card-img">
        ${isOut ? '<span class="badge-sold">غير متوفر</span>' : (isLow ? '<span class="badge-low">كمية محدودة</span>' : '')}
        <img src="${imgSrc}" alt="${p.name}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/200?text=ISLEY';">
      </div>
      <div class="card-body">
        <span class="card-cat">${p.category || 'ISLEY'}</span>
        <h3>${p.name}</h3>
        <div class="card-footer">
          <div class="price">${fmt(p.price)}<small> ج.س</small></div>
          <div class="${isOut ? 'stock-no' : 'stock-ok'}">${isOut ? 'نفذ' : p.qty + ' متاح'}</div>
        </div>
        <button class="add-btn" data-id="${p.id}" ${isOut ? 'disabled' : ''}>${isOut ? 'غير متوفر' : 'أضف للسلة'}</button>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.querySelectorAll('.add-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      cart[id] = (cart[id] || 0) + 1;
      updateCartCount();
      btn.textContent = 'اتضاف ✓';
      setTimeout(() => { if(!btn.disabled) btn.textContent = 'أضف للسلة'; }, 1000);
    });
  });
}

function updateCartCount(){
  const total = Object.values(cart).reduce((a,b) => a+b, 0);
  document.getElementById('cartCount').textContent = total;
}

async function fetchProducts(){
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=products`);
    const json = await res.json();
    
    console.log("البيانات القادمة من Apps Script:", json); // للتحقق في المتصفح

    if(json.status !== 'ok') throw new Error(json.message || 'خطأ في جلب البيانات');
    
    // توحيد نمط البيانات القادمة من الشيت
    allProducts = (json.data || []).map((item, index) => normalizeProduct(item, index));
    
    if(firstLoad){ 
      if(loadingState) loadingState.remove(); 
      firstLoad = false; 
    }
    applyFilters();
  } catch(err){
    if(loadingState) loadingState.textContent = 'حصل خطأ في جلب البيانات. افحص الكونسول (Console) لمعرفة السبب.';
    console.error("Fetch Error:", err);
  }
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('refreshBtn').addEventListener('click', fetchProducts);
document.getElementById('searchToggleBtn').addEventListener('click', () => {
  document.getElementById('searchWrap').classList.toggle('show');
  document.getElementById('searchInput').focus();
});

document.querySelectorAll('[data-filter]').forEach(el => {
  el.addEventListener('click', (e) => {
    if(el.tagName === 'A') e.preventDefault();
    activeFilter = el.dataset.filter || '';
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
    const matchingChip = document.querySelector(`.cat-chip[data-filter="${CSS.escape(activeFilter)}"]`);
    if(matchingChip) matchingChip.classList.add('active');
    applyFilters();
    document.getElementById('productsSection').scrollIntoView({behavior:'smooth'});
  });
});

fetchProducts();
setInterval(fetchProducts, 20000);

const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');
const drawerBody = document.getElementById('drawerBody');
const drawerFooter = document.getElementById('drawerFooter');

function openDrawer(){ 
  drawer.classList.add('show'); 
  drawerOverlay.classList.add('show'); 
}
function closeDrawer(){ 
  drawer.classList.remove('show'); 
  drawerOverlay.classList.remove('show'); 
}

document.getElementById('openCartBtn').addEventListener('click', openDrawer);
document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);
</script>
