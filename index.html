<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجرنا</title>
  <style>
    /* ========== Reset & Base ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #2c3e50;
      --accent:    #e67e22;
      --accent2:   #27ae60;
      --bg:        #f4f6f8;
      --card-bg:   #ffffff;
      --text:      #2c3e50;
      --muted:     #7f8c8d;
      --border:    #e0e0e0;
      --radius:    12px;
      --shadow:    0 2px 12px rgba(0,0,0,.08);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ========== Header ========== */
    header {
      background: var(--primary);
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    header h1 { font-size: 1.4rem; letter-spacing: .5px; }
    header .tagline { font-size: .8rem; opacity: .7; margin-top: 2px; }
    .header-left { display: flex; flex-direction: column; }

    .cart-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 8px 16px;
      cursor: pointer;
      font-size: .9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .2s;
    }
    .cart-btn:hover { background: #d35400; }
    .cart-count {
      background: #fff;
      color: var(--accent);
      border-radius: 50%;
      width: 20px; height: 20px;
      font-size: .75rem;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold;
    }

    /* ========== Search & Filter ========== */
    .toolbar {
      max-width: 1100px;
      margin: 24px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 40px 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .95rem;
      outline: none;
      transition: border .2s;
      background: #fff;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box .icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .filter-select {
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .95rem;
      outline: none;
      background: #fff;
      cursor: pointer;
      transition: border .2s;
    }
    .filter-select:focus { border-color: var(--accent); }

    /* ========== Stats Bar ========== */
    .stats-bar {
      max-width: 1100px;
      margin: 12px auto 0;
      padding: 0 16px;
      color: var(--muted);
      font-size: .85rem;
    }

    /* ========== Grid ========== */
    .grid {
      max-width: 1100px;
      margin: 16px auto 40px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    /* ========== Card ========== */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .2s, box-shadow .2s;
      border: 1.5px solid transparent;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      border-color: var(--accent);
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary), #3d5166);
      padding: 20px 16px 14px;
      color: #fff;
      position: relative;
    }
    .card-category {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: .75;
      margin-bottom: 4px;
    }
    .card-name {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .stock-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: .65rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    .in-stock  { background: #27ae60; color: #fff; }
    .out-stock { background: #e74c3c; color: #fff; }

    .card-body {
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-desc {
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }
    .price {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent);
    }
    .unit {
      font-size: .75rem;
      color: var(--muted);
      background: #f0f0f0;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .add-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent2);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      cursor: pointer;
      font-weight: 600;
      transition: background .2s;
      margin-top: 4px;
    }
    .add-btn:hover:not(:disabled) { background: #219a52; }
    .add-btn:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    /* ========== Loading / Empty ========== */
    .state-box {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .state-box .icon { font-size: 3rem; margin-bottom: 12px; }
    .state-box p { font-size: 1rem; }

    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #ddd;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== Cart Drawer ========== */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 200;
    }
    .overlay.open { display: block; }

    .drawer {
      position: fixed;
      top: 0; left: -420px;
      width: min(420px, 95vw);
      height: 100%;
      background: #fff;
      z-index: 201;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(0,0,0,.2);
      transition: left .3s ease;
    }
    .drawer.open { left: 0; }

    .drawer-header {
      background: var(--primary);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 600;
    }
    .close-btn {
      background: none; border: none; color: #fff;
      font-size: 1.4rem; cursor: pointer; line-height: 1;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item-name { flex: 1; font-size: .9rem; font-weight: 600; }
    .cart-item-price { color: var(--accent); font-weight: 700; font-size: .9rem; }
    .qty-ctrl {
      display: flex; align-items: center; gap: 6px;
    }
    .qty-btn {
      width: 26px; height: 26px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .qty-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .qty-num { font-weight: 700; min-width: 20px; text-align: center; font-size: .9rem; }

    .drawer-footer {
      padding: 16px 20px;
      border-top: 2px solid var(--border);
    }
    .total-row {
      display: flex; justify-content: space-between;
      font-size: 1.1rem; font-weight: 700;
      margin-bottom: 14px;
    }
    .total-val { color: var(--accent); }
    .whatsapp-btn {
      width: 100%;
      padding: 12px;
      background: #25d366;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .2s;
    }
    .whatsapp-btn:hover { background: #1ebe5d; }
    .empty-cart { text-align: center; padding: 40px 0; color: var(--muted); }
    .empty-cart .icon { font-size: 2.5rem; }

    /* ========== Toast ========== */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--primary);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: .9rem;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
      transition: transform .3s;
      z-index: 300;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ========== Responsive ========== */
    @media (max-width: 500px) {
      header h1 { font-size: 1.1rem; }
      .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .card-name { font-size: .95rem; }
      .price { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<!-- ===== Header ===== -->
<header>
  <div class="header-left">
    <h1>🛍️ متجرنا</h1>
    <span class="tagline">أسعار محدّثة لحظيًا</span>
  </div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 السلة
    <span class="cart-count" id="cartCount">0</span>
  </button>
</header>

<!-- ===== Toolbar ===== -->
<div class="toolbar">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ابحث عن منتج..." oninput="renderProducts()" />
    <span class="icon">🔍</span>
  </div>
  <select class="filter-select" id="categoryFilter" onchange="renderProducts()">
    <option value="">كل الأقسام</option>
  </select>
  <select class="filter-select" id="stockFilter" onchange="renderProducts()">
    <option value="">الكل</option>
    <option value="true">متاح فقط</option>
    <option value="false">غير متاح</option>
  </select>
</div>

<div class="stats-bar" id="statsBar"></div>

<!-- ===== Products Grid ===== -->
<div class="grid" id="grid">
  <div class="state-box">
    <div class="spinner"></div>
    <p>جاري تحميل المنتجات...</p>
  </div>
</div>

<!-- ===== Cart Overlay + Drawer ===== -->
<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span>🛒 سلة المشتريات</span>
    <button class="close-btn" onclick="toggleCart()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer" id="drawerFooter"></div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<script>
// =====================================================
//  ← ضع رابط الـ Web App بتاعك هنا
// =====================================================
var API_URL = " https://script.google.com/macros/s/AKfycbzNsI6c3Q1mJirRP0FKmQyi5rg1IxySYdC1PweO7hGrS13CypuKIz5FLURm9Q8f352LVA/exec";

// رقم واتساب للطلبات (بدون + وبدون صفر في الأول)
var WHATSAPP_NUMBER = "201000000000"; // ← غيّره برقمك

// =====================================================
var allProducts = [];
var cart = [];

// ===== تحميل المنتجات =====
function loadProducts() {
  fetch(API_URL)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.status !== "ok") throw new Error(data.message);
      allProducts = data.products || [];
      buildCategoryFilter();
      renderProducts();
    })
    .catch(function(err){
      document.getElementById("grid").innerHTML =
        '<div class="state-box"><div class="icon">⚠️</div><p>تعذّر تحميل المنتجات.<br>تأكد من رابط الـ API في الكود.</p></div>';
    });
}

// ===== بناء فلتر الأقسام =====
function buildCategoryFilter() {
  var cats = [...new Set(allProducts.map(function(p){ return p.category || "عام"; }))];
  var sel = document.getElementById("categoryFilter");
  cats.forEach(function(c){
    var o = document.createElement("option");
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
}

// ===== عرض المنتجات =====
function renderProducts() {
  var search   = document.getElementById("searchInput").value.trim().toLowerCase();
  var catFilter = document.getElementById("categoryFilter").value;
  var stockFilter = document.getElementById("stockFilter").value;

  var filtered = allProducts.filter(function(p){
    var matchSearch = !search ||
      (p.name || "").toLowerCase().includes(search) ||
      (p.description || "").toLowerCase().includes(search) ||
      (p.category || "").toLowerCase().includes(search);
    var matchCat   = !catFilter || (p.category || "عام") === catFilter;
    var matchStock = stockFilter === "" ? true :
                     stockFilter === "true" ? (p.inStock === true || p.inStock === "TRUE" || p.inStock === "true") :
                     !(p.inStock === true || p.inStock === "TRUE" || p.inStock === "true");
    return matchSearch && matchCat && matchStock;
  });

  document.getElementById("statsBar").textContent =
    "عرض " + filtered.length + " من " + allProducts.length + " منتج";

  var grid = document.getElementById("grid");
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="state-box"><div class="icon">🔍</div><p>لا توجد منتجات مطابقة للبحث</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(function(p){
    var inStock = (p.inStock === true || p.inStock === "TRUE" || p.inStock === "true");
    var price = parseFloat(p.price) || 0;
    return '<div class="card">' +
      '<div class="card-header">' +
        '<span class="stock-badge ' + (inStock ? "in-stock" : "out-stock") + '">' +
          (inStock ? "✓ متاح" : "✗ نفذ") + '</span>' +
        '<div class="card-category">' + escHtml(p.category || "عام") + '</div>' +
        '<div class="card-name">' + escHtml(p.name || "") + '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<p class="card-desc">' + escHtml(p.description || "") + '</p>' +
        '<div class="price-row">' +
          '<span class="price">' + price.toLocaleString("ar-EG") + ' جنيه</span>' +
          '<span class="unit">' + escHtml(p.unit || "قطعة") + '</span>' +
        '</div>' +
        '<button class="add-btn" ' + (!inStock ? 'disabled' : '') + ' onclick="addToCart(' + "'" + escAttr(p.id) + "'" + ')">' +
          (inStock ? '+ أضف للسلة' : 'غير متاح') +
        '</button>' +
      '</div>' +
    '</div>';
  }).join("");
}

// ===== السلة =====
function addToCart(id) {
  var p = allProducts.find(function(x){ return String(x.id) === String(id); });
  if (!p) return;
  var item = cart.find(function(x){ return String(x.id) === String(id); });
  if (item) { item.qty++; } else { cart.push({ id: p.id, name: p.name, price: parseFloat(p.price)||0, qty: 1, unit: p.unit||"قطعة" }); }
  updateCartCount();
  showToast("✓ تمت الإضافة: " + p.name);
  renderCart();
}

function changeQty(id, delta) {
  var idx = cart.findIndex(function(x){ return String(x.id) === String(id); });
  if (idx === -1) return;
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  updateCartCount();
  renderCart();
}

function updateCartCount() {
  var total = cart.reduce(function(s,i){ return s + i.qty; }, 0);
  document.getElementById("cartCount").textContent = total;
}

function toggleCart() {
  document.getElementById("drawer").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("open");
  renderCart();
}

function renderCart() {
  var body   = document.getElementById("drawerBody");
  var footer = document.getElementById("drawerFooter");

  if (cart.length === 0) {
    body.innerHTML = '<div class="empty-cart"><div class="icon">🛒</div><p>السلة فارغة</p></div>';
    footer.innerHTML = "";
    return;
  }

  body.innerHTML = cart.map(function(item){
    return '<div class="cart-item">' +
      '<div class="cart-item-name">' + escHtml(item.name) + '<br><small style="color:var(--muted)">' + escHtml(item.unit) + '</small></div>' +
      '<div class="qty-ctrl">' +
        '<button class="qty-btn" onclick="changeQty(\'' + escAttr(item.id) + '\',-1)">−</button>' +
        '<span class="qty-num">' + item.qty + '</span>' +
        '<button class="qty-btn" onclick="changeQty(\'' + escAttr(item.id) + '\',1)">+</button>' +
      '</div>' +
      '<div class="cart-item-price">' + (item.price * item.qty).toLocaleString("ar-EG") + ' ج</div>' +
    '</div>';
  }).join("");

  var total = cart.reduce(function(s,i){ return s + i.price * i.qty; }, 0);
  footer.innerHTML =
    '<div class="total-row"><span>الإجمالي</span><span class="total-val">' + total.toLocaleString("ar-EG") + ' جنيه</span></div>' +
    '<button class="whatsapp-btn" onclick="sendWhatsApp()">📲 أرسل الطلب عبر واتساب</button>';
}

function sendWhatsApp() {
  if (cart.length === 0) return;
  var lines = ["🛍️ *طلب جديد من المتجر*\n"];
  cart.forEach(function(item){
    lines.push("• " + item.name + " × " + item.qty + " = " + (item.price * item.qty).toLocaleString("ar-EG") + " جنيه");
  });
  var total = cart.reduce(function(s,i){ return s + i.price * i.qty; }, 0);
  lines.push("\n💰 *الإجمالي: " + total.toLocaleString("ar-EG") + " جنيه*");
  var msg = encodeURIComponent(lines.join("\n"));
  window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + msg, "_blank");
}

// ===== Toast =====
function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

// ===== Helpers =====
function escHtml(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escAttr(s) { return String(s).replace(/'/g,"\\'"); }

// ===== Boot =====
loadProducts();
</script>
</body>
</html>
